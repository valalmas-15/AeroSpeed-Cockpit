name: speedometer_app
description: "A futuristic horizontal cockpit dashboard featuring GPS Speedometer, Interactive Navigation Maps, and Amazfit Active 2 BLE Heart Rate integration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Bluetooth Low Energy for Amazfit Active 2
  flutter_blue_plus: ^1.34.5

  # GPS & Geolocation for Real-time Speed
  geolocator: ^12.0.0

  # Interactive Maps & OpenStreetMap Navigation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # HTTP for Routing (OSRM) and Geocoding (Nominatim)
  http: ^1.2.2

  # Utilities
  intl: ^0.20.2
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
